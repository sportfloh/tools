name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'

# Pinned tool versions (keep in sync with CLAUDE.md "Tooling versions").
env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  # Workspace-wide checks, run once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          # One key per job: jobs build different things (lint: wasm32 check,
          # test: native + wasm-pack), so a shared key made each job restore
          # another job's target/ and rebuild its own every time.
          key: ${{ runner.os }}-cargo-ci-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-lint-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

  # Native + WASM tests per tool.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [trackit, tech-event-announce]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-ci-test-${{ matrix.tool }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-test-${{ matrix.tool }}-
            ${{ runner.os }}-cargo-

      - name: Native tests
        run: cargo test --lib -p ${{ matrix.tool }}

      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }}
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          wasm-pack --version

      - name: WASM tests
        working-directory: tools/${{ matrix.tool }}
        run: wasm-pack test --headless --chrome
