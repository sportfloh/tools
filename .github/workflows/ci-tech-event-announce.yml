name: CI — tech-event-announce

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/tech-event-announce/**'
      - 'tools/_shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-tech-event-announce.yml'

# Pinned tool versions (keep in sync with CLAUDE.md "Tooling versions").
env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Native tests
        run: cargo test --lib -p tech-event-announce

      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }}
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          wasm-pack --version

      - name: WASM tests
        working-directory: tools/tech-event-announce
        run: wasm-pack test --headless --chrome
