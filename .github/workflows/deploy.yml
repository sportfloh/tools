name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/**'
      - main
      - master
    paths:
      - 'tools/trackit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Force remaining node20 actions (actions/deploy-pages has no node24 release yet)
# to run on Node.js 24. Remove once deploy-pages ships a node24 build.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install trunk
        run: cargo binstall trunk --no-confirm

      - name: Build trackit
        working-directory: tools/trackit
        run: trunk build --release --public-url /tools/trackit/

      - name: Verify trackit dist structure
        run: |
          # SW and icon must be at the dist root (not in a public/ subdirectory)
          # for the service worker to register correctly and manifest icon to resolve.
          fail=0
          for f in service-worker.js icon.svg; do
            if [ ! -f "tools/trackit/dist/$f" ]; then
              echo "FAIL: tools/trackit/dist/$f is missing"; fail=1
            fi
            if [ -f "tools/trackit/dist/public/$f" ]; then
              echo "FAIL: tools/trackit/dist/public/$f exists — file is at the wrong path"; fail=1
            fi
          done
          exit $fail

      - name: Assemble Pages dist
        run: |
          mkdir -p dist/trackit
          cp -r tools/trackit/dist/. dist/trackit/

      - name: Create Pages artifact
        run: |
          tar --dereference --hard-dereference \
              --directory dist/ \
              -cvf "$RUNNER_TEMP/artifact.tar" \
              --exclude=.git --exclude=.github \
              .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
