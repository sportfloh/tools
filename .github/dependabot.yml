version: 2
updates:
  # Minor/patch bumps arrive as one weekly PR per ecosystem instead of one
  # PR per crate/action; major versions still get their own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
