[package]
name = "trackit"
version = "0.1.0"
edition = "2024"

[lib]
name = "trackitlib"
crate-type = ["rlib"]

[[bin]]
name = "trackit"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8.21", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Window", "Storage", "History",
    "Blob", "Url",
    "Document", "HtmlElement",
    "HtmlAnchorElement", "HtmlInputElement",
    "FileReader", "File", "FileList",
    "TouchEvent", "Touch", "TouchList",
    "Navigator", "Geolocation", "Crypto",
    "GeolocationPosition", "GeolocationCoordinates", "PositionOptions",
] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
rexie = "0.6"
futures = "0.3"  # join_all: issue many IndexedDB requests in one transaction at once
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

